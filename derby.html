<style>
:root{
  --bg:#0b0906; --panel:#17120c; --panel2:#1f1810; --line:#3a2a16;
  --gold:#f6b45a; --gold2:#e2892a; --gold3:#ffd79a;
  --text:#f2e6d4; --dim:#a68a66; --good:#7ddc8a; --bad:#e2705a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:radial-gradient(120% 100% at 50% 0%,#241706 0%,var(--bg) 60%);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#app{max-width:1100px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:10px;padding:12px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;flex:0 0 auto}
h1{font-size:19px;letter-spacing:.02em}
h1 b{color:var(--gold)}
.sub{font-size:12.5px;color:var(--dim)}
.sub b{color:var(--gold3);font-weight:600}
main{flex:1 1 auto;display:grid;grid-template-columns:1fr 300px;gap:10px;min-height:0}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:14px;padding:12px;min-height:0;display:flex;flex-direction:column}
.card h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center}
.card h2 span.t{color:var(--gold);font-weight:700;letter-spacing:.02em;text-transform:none;font-size:13px}

/* the course, seen from above, like the original */
#course{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;min-height:0}
/* The canvas is out of the layout flow, so its bitmap size can never push the box around. */
#cvwrap{position:relative;flex:1 1 auto;min-height:80px}
#cv{position:absolute;inset:0;width:100%;height:100%;border-radius:10px;background:#0d3b12;display:block}
#runners{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px}
.rc{display:flex;align-items:center;gap:5px;background:#120d07;border:1px solid #251a0d;border-radius:8px;
  padding:4px 7px;font-size:11.5px}
.rc b{font-variant-numeric:tabular-nums;color:var(--gold3)}
.rc .dot{width:9px;height:9px;border-radius:50%}
.rc.lead{border-color:var(--gold2)}
.rc em{font-style:normal;color:var(--dim)}

/* bet row */
.bets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bets button{flex:1 1 0;min-width:88px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
  color:var(--text);font:inherit;font-size:12.5px;padding:9px 6px;cursor:pointer;text-align:center}
.bets button.on{border-color:var(--gold2);color:var(--gold3)}
.bets button .pl{display:block;color:var(--dim);font-size:10.5px;min-height:12px}
.bets button:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.btn{background:linear-gradient(180deg,#f6b45a,#c9721b);color:#2a1603;border:none;border-radius:10px;
  font:inherit;font-weight:700;font-size:13px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--gold);font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.amt{display:flex;gap:6px}
.amt button{background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--text);
  font:inherit;font-size:12px;padding:7px 10px;cursor:pointer}
.amt button.on{border-color:var(--gold2);color:var(--gold3)}
.pts{font-variant-numeric:tabular-nums}

/* chat */
#chat{flex:1 1 auto;overflow-y:auto;display:flex;flex-direction:column;gap:5px;font-size:12.5px;min-height:0}
#chat .m b{color:var(--gold);font-weight:600}
#chat .m.sys{color:var(--dim);font-style:italic}
.cin{display:flex;gap:6px;margin-top:8px}
.cin input{flex:1;min-width:0;background:#120d07;border:1px solid var(--line);border-radius:10px;color:var(--text);
  font:inherit;font-size:12.5px;padding:9px 10px}
.cin input:focus{outline:none;border-color:var(--gold2)}
.call{color:var(--gold3);font-style:italic}
.tally{flex:0 0 auto;border-top:1px solid var(--line);margin-top:8px}

.tr em{font-style:normal;color:var(--dim);font-size:11px}
.tr b{color:var(--gold3);font-variant-numeric:tabular-nums}
footer{flex:0 0 auto;font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.live{color:var(--good);font-weight:700}
.live.off{color:var(--bad)}

  color:var(--gold3);padding:9px 15px;border-radius:11px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:820px){

  html,body{height:auto;overflow:auto}

  #app{height:auto;min-height:100%;padding:9px;gap:8px}

  main{grid-template-columns:1fr;grid-template-rows:auto auto;min-height:0}
  .card{padding:10px}
  #cvwrap{flex:0 0 auto;height:auto;aspect-ratio:26/15}  /* the course shape, so no dark bands */
  .bets{gap:5px}
  .bets button{flex:1 1 30%;min-width:0;font-size:11.5px;padding:7px 3px}
  #chat{height:150px;flex:0 0 auto}
  .row{gap:6px}
  footer{font-size:10.5px}
  footer span:first-child{display:none}
}
  #receipt{margin-top:7px;line-height:1.5;border-left:2px solid #3a3348;padding-left:9px}
  #receipt:empty{display:none}

<script type="module">
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const fmt = n => n.toLocaleString("en-US");
function toast(t){ const e = $("#toast"); e.textContent = t; e.classList.add("on");
  clearTimeout(toast.k); toast.k = setTimeout(() => e.classList.remove("on"), 2600); }

/* ---------- sound: a bell at the gate, a fanfare at the finish ---------- */
/* A stream needs sound, but a page that makes noise on its own is rude, so this starts muted. */
let AC = null, sndOn = localStorage.getItem("pd_snd") === "1";
function tone(f, t0, dur, type, vol){
  if(!sndOn) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), at = AC.currentTime + t0;
    o.type = type || "sine"; o.frequency.setValueAtTime(f, at);
    g.gain.setValueAtTime(0, at);
    g.gain.linearRampToValueAtTime(vol || 0.14, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at + dur + 0.02);
  }catch(e){}
}
const sGate    = () => { tone(880, 0, 0.13, "square", 0.1); tone(1320, 0.13, 0.2, "square", 0.09); };
const sWin     = () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.11, 0.26, "triangle", 0.12)); };
const sLead    = () => tone(660, 0, 0.06, "sine", 0.05);
const sBet     = () => tone(440, 0, 0.09, "triangle", 0.1);

/* ---------- state ---------- */
const SAVE = "pd_v1";
let S = { pts: 200, name: "", bet: null, won: 0, lost: 0, seen: 0 };
try{ const o = JSON.parse(localStorage.getItem(SAVE) || "null"); if(o) S = Object.assign(S, o); }catch(e){}
const save = () => { try{ localStorage.setItem(SAVE, JSON.stringify(S)); }catch(e){} };
if(!S.name) S.name = "guest" + Math.floor(Math.random()*9000+1000);

/* ---------- race maths: one race for everybody, from the clock ---------- */
const RACE_MS = 90000, BET_MS = 25000, RUN_MS = 55000, START = 96;
const HORSES = 6;
const EMO = ["\u{1F40E}","\u{1F33F}","\u{1FA81}","\u{1F984}","\u{1F406}","\u{1F407}"];
/* The three agents of the show ride against each other, every 90 seconds, all day. */
const DEFNAMES = ["PENNY","MINT","KITE","Compound","Interest","Small Change"];
const AGENTS = { 0: "@pennyloopHQ", 1: "@minttycoon", 2: "@KiteBuilds" };
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hash = s => { let h = 2166136261; for(const c of String(s)) h = (h ^ c.charCodeAt(0)) * 16777619 >>> 0; return h; };

const ridNow = () => Math.floor(Date.now() / RACE_MS);
const oddsCache = {};
/* The odds are published before the gate and never move, so a bet always pays what it promised.
   The salt decides how the race runs, not what it pays. */
const oddsFor = rid => (oddsCache[rid] = oddsCache[rid] || buildRace(rid, "form").odds);
const raceStart = rid => rid * RACE_MS;

/* ---------- the course, and horses that run it ----------
   The original Horse Race Tests is a top down course: horses wander a winding track, take wrong
   turns, and the first one to the carrots wins. So this is a course, not six straight lanes.
   Everything below is a pure function of the race id and the salt, so every screen shows the same
   race, and nobody can compute the winner before the room agrees the salt at the gate. */
const GW = 26, GH = 15, STEP = 50;                        /* grid, and the physics tick in ms */
const COLS = ["#f6b45a","#7ddc8a","#7ab8ff","#c9a0ff","#ff9d5c","#f0eee6"];

/* A winding corridor from the left edge to the carrots, widened into blobs, with dead ends. */
function courseFor(rid){
  const rnd = mulberry(hash("course" + rid));
  const open = new Uint8Array(GW * GH);
  const at = (x,y) => x >= 0 && x < GW && y >= 0 && y < GH ? open[y*GW+x] : 0;
  const blob = (x,y,r) => {
    for(let dy = -r; dy <= r; dy++) for(let dx = -r; dx <= r; dx++)
      if(dx*dx + dy*dy <= r*r + 1){
        const nx = x+dx, ny = y+dy;
        if(nx > 0 && nx < GW-1 && ny > 0 && ny < GH-1) open[ny*GW+nx] = 1;
      }
  };
  let x = 2, y = Math.floor(GH/2);
  blob(x, y, 2);
  const branches = [];
  while(x < GW - 3){
    const turn = rnd();
    if(turn < 0.5){ y += rnd() < 0.5 ? -2 : 2; y = clamp(y, 3, GH-4); }
    else x += 1;
    blob(x, y, rnd() < 0.15 ? 2 : 1);
    if(rnd() < 0.3) branches.push([x, y]);
  }
  blob(GW-3, y, 2);
  for(const [bx, by] of branches){                        /* dead ends, so a horse can go wrong */
    let cx = bx, cy = by;
    const len = 2 + Math.floor(rnd() * 3);
    for(let k = 0; k < len; k++){
      cx += rnd() < 0.5 ? 1 : -1; cy += rnd() < 0.5 ? -1 : 1;
      blob(clamp(cx,2,GW-3), clamp(cy,2,GH-3), 1);
    }
  }
  const goal = { x: GW-3, y };
  /* how many steps from every cell to the carrots, so a horse can be clever or stupid */
  const dist = new Int32Array(GW*GH).fill(-1);
  const q = [goal.y*GW + goal.x]; dist[q[0]] = 0;
  for(let h = 0; h < q.length; h++){
    const c = q[h], cx = c % GW, cy = (c - cx) / GW;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cx+dx, ny = cy+dy;
      if(!at(nx,ny)) continue;
      const n = ny*GW + nx;
      if(dist[n] < 0){ dist[n] = dist[c] + 1; q.push(n); }
    }
  }
  return { rid, open, dist, goal, at };
}
const courseCache = {};
const getCourse = rid => (courseCache[rid] = courseCache[rid] || courseFor(rid));

/* Run the whole race once, at the gate, and keep every position. The replay is then exact.
   The horses move like the DVD logo: a constant speed, a straight line, and a reflection off every
   wall. A bounce adds a little turn, so the path through the course is strange and unpredictable,
   which is the whole charm of the original. */
function buildRace(rid, salt){
  const c = getCourse(rid);
  const rnd = mulberry(hash(rid + ":" + (salt || "")));
  const steps = Math.floor(RUN_MS / STEP);
  const openAt = (x, y) => c.at(Math.floor(x), Math.floor(y));
  const hs = [];
  for(let i = 0; i < HORSES; i++){
    const a = (i - 2.5) * 0.34 + (rnd() - 0.5) * 0.5;         /* they leave the pen facing the course */
    const sp = 0.095 + rnd() * 0.04;                         /* cells per tick, constant */
    hs.push({ i, x: 2.5, y: c.goal.y + 0.5 + (i - 2.5) * 0.28,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, sp,
      path: new Float32Array(steps * 2), done: -1, hits: 0, recent: 0 });
  }
  const goalR = 1.7;
  let first;
  for(let t = 0; t < steps; t++){
    for(const h of hs){
      if(h.done < 0){
        let nx = h.x + h.vx, ny = h.y + h.vy, hit = false;
        if(!openAt(nx, h.y)){ h.vx = -h.vx; nx = h.x; hit = true; }
        if(!openAt(h.x, ny)){ h.vy = -h.vy; ny = h.y; hit = true; }
        if(hit && !openAt(nx, ny)){ nx = h.x; ny = h.y; }
        if(hit){                       /* a bounce turns the horse a little, and it smells carrots */
          h.hits++; h.recent += 3;
          let th = Math.atan2(h.vy, h.vx) + (rnd() - 0.5) * 0.6;
          const gth = Math.atan2(c.goal.y + 0.5 - h.y, c.goal.x + 0.5 - h.x);
          let d = ((gth - th + 9.4248) % 6.2832) - 3.1416;
          th += d * 0.18;                                     /* a small pull toward the carrots */
          if(h.recent > 9){                                   /* stuck in a corner: pick a new way */
            th = rnd() * 6.2832; h.recent = 0;
          }
          h.vx = Math.cos(th) * h.sp; h.vy = Math.sin(th) * h.sp;
        }
        if(h.recent > 0) h.recent -= 0.35;
        h.x = nx; h.y = ny;
        const dx = h.x - (c.goal.x + 0.5), dy = h.y - (c.goal.y + 0.5);
        if(dx*dx + dy*dy < goalR*goalR){ h.done = t; if(first === undefined) first = h.i; }
      }
      h.path[t*2] = h.x; h.path[t*2+1] = h.y;
    }
  }
  const far = h => { const gx = Math.floor(h.x), gy = Math.floor(h.y);
    const d = c.at(gx,gy) ? c.dist[gy*GW+gx] : 999; return d < 0 ? 999 : d; };
  const rank = [...hs].sort((a,b) =>
    (a.done < 0 ? 1e6 + far(a) : a.done) - (b.done < 0 ? 1e6 + far(b) : b.done));
  const winner = first !== undefined ? first : rank[0].i;
  const order = rank.map(h => h.i);
  /* the odds are published from the "form" seed before the gate, so they never move */
  const odds = hs.map(h => clamp(Math.round((2 + (0.12 - h.sp) * 40 + rnd() * 4) * 10) / 10, 1.6, 14));
  return { rid, salt: salt || "", c, hs, steps, order, odds, winner, first };
}
/* where a horse is at t ms into the run, in grid coordinates */
function posOf(race, h, t){
  const f = clamp(t / RUN_MS, 0, 1) * (race.steps - 1);
  const i = Math.floor(f), j = Math.min(race.steps - 1, i + 1), a = f - i;
  return [h.path[i*2] + (h.path[j*2] - h.path[i*2]) * a,
          h.path[i*2+1] + (h.path[j*2+1] - h.path[i*2+1]) * a];
}
/* how far a horse still has to go, 0 is the carrots */
function leftOf(race, h, t){
  const [x,y] = posOf(race, h, t), gx = Math.round(x), gy = Math.round(y);
  const d = race.c.at(gx,gy) ? race.c.dist[gy*GW+gx] : 999;
  return d < 0 ? 999 : d;
}

/* ---------- the shared room: chat, the salt, the horse names, the head count ---------- */
const ROOM = "pennyderby-1";
let sock = null, live = false, chat = [], names = null, salts = {}, heads = 1, hist = [];
let board = { d: "", u: {} };   /* the day's best bettors, by name */
let shist = [];                 /* the last salts, so an old race can be replayed and checked */
let replay = null, wantReplay = 0;
/* the money the room has on each horse in the race being bet on */
let pool = { rid: -1, tot: [] };
function send(key, value){ if(sock && sock.readyState === 1)
  try{ sock.send(JSON.stringify({ type:"set", key, value })); }catch(e){} }
function connect(){
  if(typeof WebSocket === "undefined") return;
  let s; try{ s = new WebSocket(`wss://${location.host}/ws/${ROOM}`); }catch(e){ return; }
  sock = s;
  s.onopen = () => { live = true; paint(); };
  s.onclose = () => { live = false; sock = null; paint(); setTimeout(connect, 2000); };
  s.onerror = () => { live = false; paint(); };
  s.onmessage = ev => {
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.type === "welcome"){
      const st = m.state || {};
      takeChat(st.chat); takeNames(st.names); takeSalt(st.salt); takeHist(st.hist); takePool(st.pool);
      takeBoard(st.board);
      takeSHist(st.shist);
      if(wantReplay) startReplay(wantReplay);
    } else if(m.type === "set"){
      if(m.key === "chat") takeChat(m.value);
      else if(m.key === "names") takeNames(m.value);
      else if(m.key === "salt") takeSalt(m.value);
      else if(m.key === "hist") takeHist(m.value);
      else if(m.key === "pool") takePool(m.value);
      else if(m.key === "board") takeBoard(m.value);
      else if(m.key === "shist") takeSHist(m.value);
    } else if(m.type === "peers" && typeof m.count === "number"){ heads = m.count;
      $("#watching").textContent = heads > 1 ? heads + " watching" : ""; }
  };
}
function takeChat(v){
  if(!Array.isArray(v)) return;
  const seen = new Set(chat.map(c => c.id));
  for(const raw of v.slice(-60)){
    if(!raw || typeof raw !== "object") continue;
    const id = String(raw.id || "").slice(0,24), n = String(raw.n || "").replace(/[<>\n\r]/g,"").slice(0,16);
    const t = String(raw.t || "").replace(/[<>\n\r]/g,"").slice(0,120);
    if(!id || !n || !t || seen.has(id)) continue;
    seen.add(id); chat.push({ id, n, t, at: Number(raw.at) || Date.now() });
  }
  chat.sort((a,b) => a.at - b.at); chat = chat.slice(-60); paintChat();
}
/* The pool is the room's money on each horse. Merge by the larger number per horse, so a client
   that missed a message cannot erase a bet somebody else already placed. */
function takePool(v){
  if(!v || typeof v !== "object") return;
  const rid = Number(v.rid), tot = Array.isArray(v.tot) ? v.tot : null;
  if(!isFinite(rid) || !tot || rid < pool.rid) return;
  if(rid !== pool.rid) pool = { rid, tot: Array(HORSES).fill(0) };
  for(let i = 0; i < HORSES; i++){
    const n = Number(tot[i]); if(n > 0 && n < 1e12) pool.tot[i] = Math.max(pool.tot[i] || 0, Math.floor(n));
  }
  paintBets();
}
function addPool(rid, h, amt){
  if(rid !== pool.rid) pool = { rid, tot: Array(HORSES).fill(0) };
  pool.tot[h] = (pool.tot[h] || 0) + amt;
  send("pool", pool); paintBets();
}
/* One row per race, keyed by race id, so the same result never counts twice. */
function takeHist(v){
  if(!Array.isArray(v)) return;
  const by = new Map(hist.map(h => [h.rid, h]));
  for(const raw of v.slice(-60)){
    const rid = Number(raw && raw.rid), w = Number(raw && raw.w);
    if(!isFinite(rid) || !(w >= 0 && w < HORSES)) continue;
    if(!by.has(rid)) by.set(rid, { rid, w });
  }
  hist = [...by.values()].sort((a,b) => a.rid - b.rid).slice(-60);
  paintTally();
}
function addHist(rid, w){
  if(hist.some(h => h.rid === rid)) return;
  hist.push({ rid, w }); hist = hist.slice(-60);
  send("hist", hist.slice(-40)); paintTally();
}
function paintTally(){
  const day = Math.floor(Date.now() / 86400000) * 86400000;
  const today = hist.filter(h => h.rid * RACE_MS >= day);
  const n = Array.from({ length: HORSES }, (_, i) => today.filter(h => h.w === i).length);
  const rank = n.map((v,i) => [i,v]).sort((a,b) => b[1] - a[1]);
  $("#tally").innerHTML = rank.map(([i,v]) =>
    `<div class="tr"><span>${EMO[i]} ${horseName(i)}${AGENTS[i] ? ' <em>' + AGENTS[i] + '</em>' : ''}</span><b>${v}</b></div>`).join("");
  $("#recent").innerHTML = today.length
    ? "last results " + today.slice(-14).map(h =>
        `<span title="race #${h.rid % 100000}: ${horseName(h.w)}">${EMO[h.w]}</span>`).join("")
    : "no races yet today";
}
/* ---------- the day's board: what the room actually won ----------
   Every screen keeps the best result it has seen for each name today, and the merge takes the larger
   number, so the board survives people closing the tab. It resets by itself at midnight UTC. */
const dayKey = () => new Date().toISOString().slice(0,10);
function takeBoard(v){
  if(!v || typeof v !== "object" || String(v.d || "") !== dayKey() || typeof v.u !== "object") return;
  if(board.d !== dayKey()) board = { d: dayKey(), u: {} };
  for(const k of Object.keys(v.u).slice(0, 200)){
    const nm = String(k).replace(/[<>\n\r]/g,"").trim().slice(0,14);
    const n = Math.floor(Number(v.u[k]));
    /* "probe" was my own test entry while I checked the merge. A test must not sit on a public board. */
    if(!nm || nm.toLowerCase() === "probe" || !isFinite(n) || n <= 0 || n > 1e9) continue;
    board.u[nm] = Math.max(board.u[nm] || 0, n);
  }
  paintBoard();
}
/* my own profit for the day, so the board is not the only number that moves */
function rollDay(){ if(S.day !== dayKey()){ S.day = dayKey(); S.prof = 0; S.gwin = 0; } }
function dayProfit(delta){
  rollDay();
  S.prof = (S.prof || 0) + delta;
  save(); paintBoard(); return S.prof;
}
/* what you won today, before your losses. A ticket pays on winnings, so one good race is enough. */
function dayWin(win){ rollDay(); S.gwin = (S.gwin || 0) + win; save(); return S.gwin; }
function addBoard(profit){
  if(!(profit > 0)) return;
  if(board.d !== dayKey()) board = { d: dayKey(), u: {} };
  board.u[S.name] = Math.max(board.u[S.name] || 0, Math.floor(profit));
  send("board", board); paintBoard();
}
function paintBoard(){
  const rows = Object.entries(board.d === dayKey() ? board.u : {}).sort((a,b) => b[1] - a[1]).slice(0,3);
  const mine = S.day === dayKey() ? (S.prof || 0) : 0;
  $("#myprof").textContent = mine === 0 ? "" : (mine > 0 ? "you +" + fmt(mine) : "you " + fmt(mine));
  $("#board").innerHTML = rows.length
    ? rows.map(([nm,v],i) => `<div class="tr"><span>${i+1}. ${nm}${nm === S.name ? " <em>you</em>" : ""}</span><b>${fmt(v)}</b></div>`).join("")
    : `<div class="sub">Nobody has won today yet. Win a bet and your name goes here.</div>`;
}
function takeNames(v){
  if(!v || typeof v !== "object") return;
  const out = {};
  for(const k of Object.keys(v)){
    const i = Number(k); if(!(i >= 0 && i < HORSES)) continue;
    const n = String(v[k]).replace(/[<>\n\r]/g,"").trim().slice(0,14);
    if(n) out[i] = n;
  }
  names = out; paint();
}
/* ---------- the salt history: a race stays checkable after it has run ----------
   The room keeps the last salts, so a shared link to an old race can replay it and print the same
   receipt. Without this a permalink is only a promise; with it, it is evidence. */
function takeSHist(v){
  if(!Array.isArray(v)) return;
  for(const raw of v.slice(-60)){
    const r = Number(raw && raw.r), sv = String((raw && raw.s) || "").slice(0,12);
    if(!isFinite(r) || !sv) continue;
    if(!salts[r] || sv < salts[r]) salts[r] = sv;
  }
  rebuildSHist();
}
function rebuildSHist(){
  shist = Object.keys(salts).map(Number).sort((a,b) => a - b).slice(-40).map(r => ({ r, s: salts[r] }));
}
function pushSalt(rid, salt){
  if(!salts[rid] || salt < salts[rid]) salts[rid] = salt;
  rebuildSHist(); send("shist", shist);
}

function takeSalt(v){
  if(!v || typeof v !== "object") return;
  const rid = Number(v.rid), salt = String(v.salt || "").slice(0,12);
  if(!isFinite(rid) || !salt) return;
  if(!salts[rid] || salt < salts[rid]) salts[rid] = salt;   // lowest string wins, so everybody agrees
  rebuildSHist();
}
const horseName = i => (names && names[i]) || DEFNAMES[i];
connect();
setInterval(() => { if(!sock) connect(); }, 5000);

/* ---------- the salt: nobody can read the result before the gate opens ---------- */
/* The race is a pure function of a salt that the room agrees on when betting closes.
   Before that moment the salt does not exist, so an early reader cannot know the winner. */
let saltSent = 0;
function saltFor(rid){ return salts[rid] || ""; }
function maybeSendSalt(rid, phase){
  if(phase !== "run" || salts[rid] || saltSent === rid || !live) return;
  saltSent = rid;
  setTimeout(() => {
    if(salts[rid]) return;
    const salt = Math.random().toString(36).slice(2, 10);
    salts[rid] = salt; send("salt", { rid, salt }); pushSalt(rid, salt);
  }, Math.random() * 500);
}

/* ---------- render ---------- */
let curRid = -1, race = null, betH = -1, betAmt = 25, paid = -1;
const AMTS = [10, 25, 100, "all"];
const cv = $("#cv"), ctx = cv.getContext("2d");
const TILE = 22;                                   /* the course is drawn once at this size */
let CELL = 20, offX = 0, offY = 0, lastBox = "", lastMeasure = 0;
function sizeCanvas(){
  const w = Math.max(200, cv.clientWidth), h = Math.max(120, cv.clientHeight);
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
  CELL = Math.min(cv.width / GW, cv.height / GH);
  offX = (cv.width - CELL * GW) / 2; offY = (cv.height - CELL * GH) / 2;
}
/* One picture per race at a fixed size. Every frame just scales it, which is cheap. */
let courseBmp = null, courseRid = -1;
function drawCourse(){
  if(!race) return;
  const c = document.createElement("canvas"); c.width = GW * TILE; c.height = GH * TILE;
  const g = c.getContext("2d");
  g.fillStyle = "#0f7a1e"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#12a02a";
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++)
    if((x + y) % 2 === 0) g.fillRect(x*TILE, y*TILE, TILE, TILE);
  g.fillStyle = "#d8b57a";
  for(let y = 0; y < GH; y++) for(let x = 0; x < GW; x++) if(race.c.open[y*GW+x]){
    g.beginPath(); g.arc((x+0.5)*TILE, (y+0.5)*TILE, TILE*0.8, 0, 7); g.fill();
  }
  g.font = Math.round(TILE*1.6) + "px serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("\u{1F955}", (race.c.goal.x+0.5)*TILE, (race.c.goal.y+0.5)*TILE);
  courseBmp = c; courseRid = race.rid;
}
function drawRace(t){
  if(!race) return;
  const now = Date.now();
  if(now - lastMeasure > 1000){                    /* measure at most once a second */
    lastMeasure = now;
    const box = cv.clientWidth + "x" + cv.clientHeight;
    if(box !== lastBox){ lastBox = box; sizeCanvas(); }
  }
  if(!courseBmp || courseRid !== race.rid) drawCourse();
  ctx.drawImage(courseBmp, offX, offY, CELL * GW, CELL * GH);
  const done = phaseOf().phase === "done";
  const tt = Math.min(race.steps - 1, Math.floor(clamp(t / RUN_MS, 0, 1) * (race.steps - 1)));
  for(const h of race.hs){                                   /* a fading trail, so you can follow one */
    ctx.strokeStyle = COLS[h.i]; ctx.globalAlpha = 0.35; ctx.lineWidth = Math.max(1.5, CELL*0.16);
    ctx.beginPath();
    for(let k = Math.max(0, tt - 40); k <= tt; k++){
      const px = offX + (h.path[k*2] + 0.5) * CELL, py = offY + (h.path[k*2+1] + 0.5) * CELL;
      k === Math.max(0, tt - 40) ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  for(const h of race.hs){
    const [x, y] = posOf(race, h, t);
    const px = offX + (x+0.5)*CELL, py = offY + (y+0.5)*CELL;
    ctx.beginPath(); ctx.arc(px, py, CELL*0.44, 0, 7);
    ctx.fillStyle = COLS[h.i]; ctx.fill();
    if(done && h.i === race.winner){
      ctx.lineWidth = Math.max(2, CELL*0.14); ctx.strokeStyle = "#fff"; ctx.stroke();
    }
    ctx.font = Math.round(CELL*0.7) + "px serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(EMO[h.i], px, py + CELL*0.04);
  }
}
/* the runner list under the course: colour, name, odds, and the live order */
function paintRunners(t){

  const place = {}; rank.forEach(([i], k) => place[i] = k + 1);

    `<span class="rc ${place[h.i] === 1 ? "lead" : ""}"><span class="dot" style="background:${COLS[h.i]}"></span>
      ${EMO[h.i]} ${horseName(h.i)} <em>${place[h.i]}${["st","nd","rd"][place[h.i]-1] || "th"}</em>
      <b>${oddsFor(race.rid)[h.i].toFixed(1)}x</b></span>`).join("");
}
function paintBets(){

function paint(){

function paintChat(){

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" })[c]);
function sysline(t){ chat.push({ id: "s" + Date.now() + Math.random(), n: "derby", t, at: Date.now(), sys: 1 }); paintChat(); }

function phaseOf(){
  const rid = ridNow(), into = Date.now() - raceStart(rid);
  if(into < BET_MS) return { rid, into, phase: "bet", left: BET_MS - into };
  if(into < BET_MS + RUN_MS) return { rid, into, phase: "run", t: into - BET_MS, left: BET_MS + RUN_MS - into };
  return { rid, into, phase: "done", left: RACE_MS - into };
}

/* ---------- one frame ---------- */
let lastSec = 0;
/* ---------- replay: any race the room has run can be watched again, and checked ----------
   A share link carries a race number. If the room still holds that race's salt, the page rebuilds the
   race from the number and the salt alone and plays it back. Same inputs, same race, every time. */
function startReplay(want){
  wantReplay = 0;
  /* people copy the short number they see on screen, so accept either form */
  let rid = want;
  if(want < 1000000){
    const m = Object.keys(salts).map(Number).filter(r => r % 100000 === want).sort((a,b) => b - a)[0];
    if(m) rid = m;
  }
  const salt = salts[rid];
  if(!salt){
    wantReplay = want;
    return sysline(`Race ${want % 100000} is not in the room's salt list, so I cannot replay it honestly. Only races the room has run can be replayed.`);
  }
  if(S.bet && S.bet.rid === ridNow()) return toast("Your bet is still running. Replay it after this race settles.");
  replay = { rid, race: buildRace(rid, salt), t0: Date.now() };
  race = replay.race;                      /* so the receipt below describes the replay, not the live race */
  $("#back").hidden = false;
  sysline(`Replay of race ${rid % 100000}. Same race number, same salt, same result.`);
  $("#verify").click();
}
function endReplay(){
  replay = null; race = null; $("#back").hidden = true;
  sysline("Back to the live race.");
}
function replayFrame(){
  const t = Date.now() - replay.t0;
  race = replay.race;
  if(t > RUN_MS + 4000) return endReplay();
  const tt = Math.min(t, RUN_MS);
  drawRace(tt); paintRunners(tt);
  $("#rid").textContent = "#" + (replay.rid % 100000);
  $("#phase").innerHTML = t < RUN_MS
    ? `<b>replay</b> of race ${replay.rid % 100000} · ${Math.ceil((RUN_MS - t)/1000)}s`
    : `<b>${horseName(replay.race.winner)}</b> won race ${replay.rid % 100000}`;
  if(t >= RUN_MS) $("#call").textContent = `${horseName(replay.race.winner)} won it by ${marginOf(replay.race)}. Press Verify to check that.`;
  else callRace(replay.race, tt);
}
function frame(){
  const p = phaseOf();
  if(replay){
    replayFrame();
    $("#clock").textContent = new Date().toISOString().slice(11,19) + " UTC";
    return requestAnimationFrame(frame);
  }
  if(p.rid !== curRid){                                   /* a new race */
    curRid = p.rid; race = null; betH = -1;
    if(S.bet && S.bet.rid !== p.rid) S.bet = null;
    paint();
  }
  maybeSendSalt(p.rid, p.phase);
  const salt = saltFor(p.rid);
  if(p.phase === "bet"){
    if(!race) { race = buildRace(p.rid, "form"); paint(); }
    drawRace(0); paintRunners(0);
    $("#phase").innerHTML = `betting open · <b>${Math.ceil(p.left/1000)}s</b> to the gate`;
    if(p.left > 21000) $("#call").textContent = "A new course. Six runners. First to the carrots wins.";
  } else if(p.phase === "run"){
    if(!race || race.salt !== salt) { race = buildRace(p.rid, salt); paint(); }
    if(gateRung !== p.rid && p.t < 1500){ gateRung = p.rid; sGate(); }
    $("#phase").innerHTML = `and they are off · <b>${Math.ceil(p.left/1000)}s</b> left`;
    callRace(race, p.t);
    drawRace(p.t); paintRunners(p.t);
  } else {
    if(!race || race.salt !== salt) { race = buildRace(p.rid, salt); paint(); }
    drawRace(RUN_MS); paintRunners(RUN_MS);
    $("#phase").innerHTML = `<b>${horseName(race.winner)}</b> wins · next race in ${Math.ceil(p.left/1000)}s`;
    $("#call").textContent = `${horseName(race.winner)} wins it by ${marginOf(race)}${AGENTS[race.winner] ? ", for " + AGENTS[race.winner] : ""}.`;
    settle(race);
  }
  $("#clock").textContent = new Date().toISOString().slice(11,19) + " UTC";
  const sec = Math.floor(Date.now()/1000);
  if(sec !== lastSec){
    const st = sock ? sock.readyState : 3;
    live = st === 1;
    $("#live").textContent = live ? "live" : st === 0 ? "connecting" : "offline";
    $("#live").className = "live" + (live ? "" : " off");                                     /* points for watching */
    lastSec = sec; S.seen++;
    if(S.seen % 2 === 0){ S.pts += 1; paint(); }
    if(S.seen % 10 === 0) save();
  }
  requestAnimationFrame(frame);
}
/* a commentary line, so it reads like a stream and not like a progress bar */
let gateRung = -1, calledAt = 0, calledLead = -1;
function callRace(r, t){
  const now = Date.now();
  if(now - calledAt < 4000) return;
  const rank = r.hs.map(h => [h.i, leftOf(r, h, t)]).sort((a,b) => a[1] - b[1]);
  const lead = rank[0][0], gap = rank[1][1] - rank[0][1], back = rank[HORSES-1][0];
  let line;
  if(t < 4000) line = `They are away. ${horseName(lead)} takes the first turn.`;
  else if(lead !== calledLead){ line = `${horseName(lead)} is in front now, past ${horseName(calledLead < 0 ? rank[1][0] : calledLead)}.`; sLead(); }
  else if(rank[0][1] < 6) line = `${horseName(lead)} can see the carrots.`;
  else if(gap === 0) line = `${horseName(lead)} and ${horseName(rank[1][0])} are level.`;
  else if(gap > 8) line = `${horseName(lead)} is well clear. ${horseName(back)} is lost at the back.`;
  else line = `${horseName(lead)} leads, ${horseName(rank[1][0])} tracking.`;
  calledAt = now; calledLead = lead;
  $("#call").textContent = line;
}
/* the winning margin: how far the second horse still had to run when the winner reached the carrots */
function marginOf(r){
  const w = r.hs[r.winner];
  if(w.done < 0) return "a nose";
  const t = w.done * STEP;
  const second = r.hs.map(h => [h.i, leftOf(r, h, t)]).filter(([i]) => i !== r.winner)
                     .sort((a,b) => a[1] - b[1])[0];
  const L = Math.max(1, Math.round(second[1] * 1.5));
  return L === 1 ? "a head" : L + " lengths";
}
function settle(r){
  if(paid === r.rid) return;
  paid = r.rid; sWin();
  addHist(r.rid, r.winner);
  if(S.bet && S.bet.rid === r.rid){
    if(S.bet.h === r.winner){
      const win = Math.round(S.bet.amt * oddsFor(r.rid)[S.bet.h]);
      S.pts += win; S.won++;
      dayWin(win);
      addBoard(dayProfit(win - S.bet.amt));
      toast("You win " + fmt(win) + " points.");
      bcast(`wins ${fmt(win)} points on ${horseName(r.winner)}.`);
    } else {
      S.lost++; dayProfit(-S.bet.amt);
      toast(horseName(r.winner) + " wins. Your bet is gone.");
    }
    S.bet = null; save();
  }
  paint();
}

/* ---------- input ---------- */
$("#place").onclick = () => {

  if(amt < 1) return toast("Watch a while to earn points.");
  S.pts -= amt; S.bet = { rid: p.rid, h: betH, amt }; save(); paint();
  toast(fmt(amt) + " on " + horseName(betH)); sBet();
  addPool(p.rid, betH, amt);
  bcast(`backs ${EMO[betH]} ${horseName(betH)} for ${fmt(amt)} at ${oddsFor(p.rid)[betH].toFixed(1)}x`);
};

$("#redeem").onclick = () => {

  const i = prompt("Name a horse. Everybody watching sees the name.");
  if(!i) return;
  const n = i.replace(/[<>\n\r]/g,"").trim().slice(0,14);
  if(n.length < 2) return toast("Two letters at least.");
  const slot = Math.floor(Math.random() * HORSES);
  S.pts -= 500; save();
  names = Object.assign({}, names || {}, { [slot]: n });
  send("names", names);
  toast("Horse " + (slot+1) + " is now " + n + ".");
  sysline(`${S.name} named horse ${slot+1} "${n}".`);
  paint();
};

function paintSnd(){ $("#snd").textContent = sndOn ? "Sound on" : "Sound off"; }
$("#snd").onclick = () => {
  sndOn = !sndOn; localStorage.setItem("pd_snd", sndOn ? "1" : "0"); paintSnd();
  if(sndOn) sGate();
};
paintSnd();
/* ---------- the receipt: anybody can recompute the race they just watched ----------
   The race is a pure function of the race id and the salt the room agreed at the gate. So the page
   can run the whole race again, in front of you, and show that it lands on the same result. */
function digest(r){
  return r.hs.map(h => h.i + ":" + h.done).join("|") + "#" + r.winner;
}
function shortHash(s){ return ("0000000" + hash(s).toString(16)).slice(-8); }
$("#verify").onclick = () => {
  const e = $("#receipt");
  if(!race) return;
  if(!race.salt || race.salt === "form"){
    e.innerHTML = "The salt does not exist yet. That is the point: until the gate opens, nobody can compute this race. Press Verify again after the finish.";
    return;
  }
  const again = buildRace(race.rid, race.salt);
  const same = digest(again) === digest(race);
  const d = shortHash(digest(again));
  e.innerHTML = `<b>Receipt for race ${race.rid % 100000}</b><br>`
    + `salt agreed by the room: <b>${race.salt}</b><br>`
    + `winner: <b>${horseName(race.winner)}</b> · every finish position: <b>${d}</b><br>`
    + (same
        ? `Recomputed from the id and the salt alone: <b>same race, same winner</b>. Your screen did not decide this, and neither did mine.`
        : `<b>Mismatch.</b> Tell @pennyloopHQ the race id and this receipt. A mismatch is a bug and I will publish it.`);
  sysline(`${S.name} verified race ${race.rid % 100000}: ${same ? "same winner" : "MISMATCH"} (${d}).`);
};

/* ---------- cash out: the derby pays into the tycoon game ----------
   The two games are separate origins, so they cannot read each other. A ticket carries the number
   across by hand. It holds the day, the points, and a check digit, so a typo cannot become money. */
/* Copying must never block the page. A clipboard write on an unfocused tab can hang for ever, so this
   checks focus first, never awaits on the critical path, and always shows the text as a fallback. */
function copySoft(txt){
  try{
    if(document.hasFocus() && navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(() => toast("Copied."), () => {});
      return;
    }
  }catch(e){}
  toast("Select the text above and copy it.");
}
function ticketFor(pts){
  const d = dayKey().replace(/-/g,"").slice(2);            /* yymmdd */
  const body = "PD" + d + "-" + pts;
  return body + "-" + shortHash(body + ":pennyloop").slice(0,4).toUpperCase();
}
$("#cash").onclick = () => {
  const won = S.day === dayKey() ? Math.floor(S.gwin || 0) : 0;
  if(won < 25) return toast("Win a race first. A ticket needs 25 points of winnings today.");
  const t = ticketFor(Math.min(won, 100000));
  const e = $("#receipt");
  e.innerHTML = `<b>Ticket ${t}</b><br>`
    + `${fmt(won)} points won today. Paste this into Penny Loop, on the Reinvest page, and it pays cash there.<br>`
    + `One ticket a day. The check digits stop a typo from paying out.`;
  copySoft(t);
  sysline(`${S.name} cashed out ${fmt(won)} points of winnings to Penny Loop.`);
};

$("#share").onclick = () => {
  const rid = replay ? replay.rid : race ? race.rid : ridNow();
  const url = location.origin + "/?r=" + rid;
  const txt = `Penny Derby · replay race #${rid % 100000} and check the receipt yourself. ${url}`;
  $("#receipt").innerHTML = `<b>Share this race</b><br>${txt}`;
  copySoft(txt);
};
$("#back").onclick = endReplay;
{
  const r = Number(new URLSearchParams(location.search).get("r"));
  if(isFinite(r) && r > 0 && r !== ridNow()){
    wantReplay = r;
    sysline(`Somebody shared race ${r % 100000} with you. It will replay as soon as the room sends its salt.`);
  } else if(r){
    sysline("Somebody shared a race with you. The next one starts within 90 seconds.");
  }
}
sizeCanvas();
sysline("Welcome. A race starts every 90 seconds and everybody sees the same one.");
sysline("Six horses run one winding course. The first three are the agents of the show.");
sysline("Bets close when the gate opens. The result is not decided until then.");
paint();
paintTally();
paintBoard();
requestAnimationFrame(frame);
</script>
